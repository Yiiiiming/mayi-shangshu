name: Jieqi Windows portable

on:
  push:
    branches: [main]
    paths:
      - 'jieqi/windows/**'
      - '.github/workflows/jieqi-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Preserve engine checksum bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Test and build Windows launcher
        shell: pwsh
        working-directory: jieqi/windows/launcher
        run: |
          gofmt -w .
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'Launcher tests failed' }
          New-Item -ItemType Directory -Force ../../../windows-build | Out-Null
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags "-s -w -X main.version=2026.10.29" -o ../../../windows-build/观棋揭棋.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed' }
      - name: Package full engine and sources
        shell: pwsh
        run: |
          $goLicense = Join-Path (go env GOROOT) 'LICENSE'
          python jieqi/windows/package.py --repo-root . --exe windows-build/观棋揭棋.exe --out windows-dist --commit $env:GITHUB_SHA --go-license $goLicense
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Test extracted package on Windows
        shell: pwsh
        run: |
          python jieqi/windows/ci/smoke.py --archive windows-dist/Guanqi-Jieqi-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Windows smoke test failed' }
      - name: Publish portable download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "jieqi-windows-2026.10.29-$env:GITHUB_RUN_NUMBER"
          gh release create $tag windows-dist/Guanqi-Jieqi-Windows-x64.zip windows-dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title '观棋揭棋 · Windows 免安装版' --notes-file jieqi/windows/ci/release-notes.md --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
